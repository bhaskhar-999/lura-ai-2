<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lura OS | Obsidian Galaxy Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #020202;
            --surface-1: rgba(18, 18, 22, 0.85);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --accent-cyan: #00e5ff;
            --accent-purple: #b026ff;
        }

        body { 
            font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; 
            background-color: var(--bg-deep); color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 🔥 SPACE DRIFTING CANVAS */
        #space-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.6; }

        /* 🧊 GLASS PANELS */
        .glass-island {
            background: var(--surface-1); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-light); box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel {
            background: rgba(12, 12, 15, 0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-light); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        /* ✨ TEXTAREA PHYSICS */
        #chat-input { 
            resize: none; overflow-y: auto; max-height: 250px; 
            transition: height 0.2s cubic-bezier(0.23, 1, 0.32, 1); 
            line-height: 1.6; padding: 12px 16px; color: var(--text-main); width: 100%; box-sizing: border-box;
            caret-color: var(--accent-cyan); background: transparent; border: none; outline: none; font-size: 15px;
        }
        #chat-input::placeholder { color: #555; font-weight: 400; }

        ::-webkit-scrollbar { width: 4px; height: 4px; } 
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; } 

        /* ✨ CHAT BUBBLES */
        .user-bubble { background: #1a1a1c; border: 1px solid var(--border-light); border-radius: 1.5rem; border-top-right-radius: 0.3rem; padding: 14px 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }

        /* 🔘 BUTTONS & ICONS */
        .icon-btn { color: var(--text-muted); transition: all 0.2s ease; outline: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.08); transform: scale(1.1); }
        .icon-btn.active { color: var(--accent-cyan); background: rgba(0, 229, 255, 0.15); }

        .btn-solid-white { background: #ffffff; color: #000000; font-weight: 700; transition: all 0.2s; border-radius: 1rem; }
        .btn-solid-white:hover { background: #e0e0e0; transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.3); }

        /* ✨ AGENT SELECTOR DROPDOWN (Matches image_63291b perfectly) */
        .dropdown-anim { opacity: 0; transform: scale(0.95) translateY(-10px); pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: top center; }
        .dropdown-anim.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
        
        .agent-card { background: #121215; border: 1px solid rgba(255,255,255,0.06); transition: all 0.2s ease; }
        .agent-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); transform: translateX(2px); }

        /* ✨ COMMANDER TOOLBAR */
        .format-toolbar { display: flex; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border-light); background: rgba(0,0,0,0.4); border-top-left-radius: 2rem; border-top-right-radius: 2rem; }
        .format-btn { color: #666; font-size: 11px; font-weight: 600; text-transform: uppercase; transition: all 0.2s; outline: none; }
        .format-btn:hover { color: var(--accent-cyan); }

        /* ✨ ANIMATIONS */
        @keyframes slideUpFade { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .anim-slide-up { animation: slideUpFade 0.4s ease forwards; }

        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .anim-pop { animation: popIn 0.3s ease forwards; }

        .typing-dot { width: 5px; height: 5px; background-color: var(--accent-cyan); border-radius: 50%; opacity: 0.4; animation: typingBounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; } .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 8px var(--accent-cyan); } }

        /* ✨ CODE BLOCKS */
        .code-box { border: 1px solid var(--border-light); border-radius: 0.75rem; overflow: hidden; margin: 12px 0; }
        .mac-dots { display: flex; gap: 6px; } .mac-dots span { width: 10px; height: 10px; border-radius: 50%; }
        .mac-dot-r { background: #FF5F56; } .mac-dot-y { background: #FFBD2E; } .mac-dot-g { background: #27C93F; }

        /* ✨ KINETIC SEARCH BAR LOGIC (Fixed alignment) */
        #search-container {
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute; left: 50%; width: 95%; max-width: 44rem;
        }
        .input-mode-center { top: 62%; transform: translate(-50%, -50%); }
        .input-mode-bottom { top: calc(100% - 32px); transform: translate(-50%, -100%); width: 100%; max-width: 48rem; }

        #welcome-screen { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .welcome-center { transform: translateY(-30px); opacity: 1; pointer-events: auto; }
        .welcome-hidden { transform: translateY(-80px); opacity: 0; pointer-events: none; }
    </style>
</head>
<body id="master-body">

    <!-- 🌌 SPACE CANVAS -->
    <canvas id="space-canvas"></canvas>

    <!-- 🌐 EXTERNAL LINK WARNING MODAL -->
    <div id="link-warning-modal" class="fixed inset-0 z-[99999] bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center opacity-0 transition-all duration-300">
        <div class="glass-panel p-8 rounded-3xl w-[90%] max-w-sm text-center border border-red-500/30">
            <h3 class="text-white text-lg font-semibold mb-2">External Uplink</h3>
            <p class="text-gray-400 text-xs mb-6 leading-relaxed">Proceed to this external site at your own risk:<br><span id="warning-url" class="block mt-2 font-mono text-red-400 break-all bg-black/50 p-2 rounded-lg border border-red-500/20"></span></p>
            <div class="flex gap-3 w-full">
                <button onclick="window.closeLinkWarning()" class="flex-1 py-2.5 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-semibold text-white transition-all">Cancel</button>
                <button id="confirm-link-btn" class="flex-1 py-2.5 bg-red-500 hover:bg-red-400 text-white rounded-xl text-xs font-semibold transition-all">Proceed</button>
            </div>
        </div>
    </div>

    <!-- 🔐 EXACT MATCH LOGIN VIEW (From image_63291b) -->
    <section id="login-view" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black transition-all duration-700 ease-in-out opacity-100">
        <div class="glass-panel w-full max-w-[400px] p-10 rounded-[2.5rem] flex flex-col items-center relative z-10 anim-pop border border-white/10 shadow-[0_40px_100px_rgba(0,0,0,1)]">
            <div class="text-center mb-8 w-full">
                <div class="w-16 h-16 bg-white rounded-full mx-auto flex items-center justify-center text-black mb-5 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight mb-1">Lura Intelligence</h2>
                <p class="text-xs text-gray-400 font-medium">Verify Identity to Proceed</p>
            </div>

            <div class="w-full space-y-3.5">
                <input id="auth-user" type="text" placeholder="Identity" class="w-full bg-[#141414] border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white outline-none focus:border-white/30 transition-all placeholder-gray-600" autocomplete="off" onkeydown="if(event.key === 'Enter') document.getElementById('auth-pass').focus();"/>
                
                <input id="auth-pass" type="password" placeholder="Passcode (Opt)" class="w-full bg-[#141414] border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white outline-none focus:border-white/30 transition-all placeholder-gray-600" onkeydown="if(event.key === 'Enter') window.handleLogin();"/>

                <button type="button" onclick="window.handleLogin()" class="w-full mt-4 py-3.5 btn-solid-white text-sm flex justify-center items-center">
                    Initialize Session
                </button>
                
                <!-- Real Google Auth Integration -->
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com" data-callback="handleGoogleCredentialResponse"></div>
                <div class="g_id_signin w-full flex justify-center mt-2" data-type="standard" data-shape="rectangular" data-theme="filled_black" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
            </div>
        </div>
    </section>

    <!-- 💻 MAIN WORKSPACE -->
    <div id="app-workspace" class="hidden w-screen h-[100dvh] relative z-10 flex-col overflow-hidden">
        
        <!-- 🔥 FLOATING HEADER -->
        <header id="main-header" class="absolute top-4 left-0 right-0 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
            
            <div class="flex items-center gap-3 pointer-events-auto">
                <div class="flex items-center gap-2 glass-panel rounded-full px-4 py-2 border border-white/5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_#34d399]"></span>
                    <span class="text-[10px] font-bold text-gray-300 tracking-widest uppercase">Uplink: Secure</span>
                </div>
            </div>

            <!-- Center Model Pill -->
            <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center gap-2 cursor-pointer glass-panel px-5 py-2 rounded-full hover:bg-white/10 transition-all z-50 border border-white/10 shadow-lg pointer-events-auto group" onclick="window.toggleModelDropdown(event)">
                <span id="current-model-label" class="text-xs font-semibold text-white">Lura Core</span>
                <svg id="dropdown-arrow" class="w-3.5 h-3.5 text-gray-400 group-hover:text-white transition-all duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </div>

            <!-- Right Controls -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <button onclick="window.startNewChat()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-all outline-none border border-white/5 text-gray-400 hover:text-white" title="Clear Context">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </button>
                <button onclick="window.toggleFocusMode()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-all outline-none border border-white/5 text-gray-400 hover:text-[var(--accent-cyan)]" title="Focus Mode">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                </button>
                <button onclick="window.toggleSettingsModal()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-all outline-none border border-white/5 text-gray-400 hover:text-white" title="Settings">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button onclick="window.logOut()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-all outline-none border border-white/5 text-gray-400 hover:text-red-400" title="Sign Out">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </div>
        </header>

        <!-- ✨ UPGRADED AGENT SELECTOR (Matches image_63291b perfectly) -->
        <div id="model-dropdown" class="dropdown-anim absolute top-[70px] left-1/2 transform -translate-x-1/2 w-[320px] glass-panel rounded-2xl p-3 z-[100] border border-white/10 shadow-2xl space-y-2">
            <div class="text-[10px] font-semibold text-gray-500 uppercase tracking-widest px-3 pt-1">Models</div>
            
            <div onclick="window.selectModel('Lura Core')" class="agent-card p-3 rounded-xl flex items-center justify-between cursor-pointer">
                <span class="text-sm font-semibold text-white">Lura Core</span>
                <span class="text-[10px] font-mono text-gray-400 bg-white/5 px-2 py-0.5 rounded border border-white/5">Fast</span>
            </div>
            
            <div onclick="window.selectModel('Lura Pro')" class="agent-card p-3 rounded-xl flex items-center justify-between cursor-pointer">
                <span class="text-sm font-semibold text-white">Lura Pro</span>
                <span class="text-[10px] font-mono text-white bg-white/10 px-2 py-0.5 rounded border border-white/10">Deep</span>
            </div>
            
            <div class="text-[10px] font-semibold text-gray-500 uppercase tracking-widest px-3 pt-2">Agents</div>
            
            <div onclick="window.selectModel('Roblox Engine')" class="agent-card p-3 rounded-xl flex items-center gap-3 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="14.31" x2="20.05" y1="8" y2="17.94"/><line x1="9.69" x2="21.17" y1="8" y2="8"/><line x1="7.38" x2="12" y1="12" y2="4"/><line x1="9.69" x2="3.95" y1="16" y2="6.06"/><line x1="14.31" x2="2.83" y1="16" y2="16"/><line x1="16.62" x2="12" y1="12" y2="20"/></svg>
                <span class="text-sm font-medium text-gray-200">Roblox Engine</span>
            </div>
            
            <div onclick="window.selectModel('Telugu Matrix')" class="agent-card p-3 rounded-xl flex items-center gap-3 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1"/></svg>
                <span class="text-sm font-medium text-gray-200">Telugu Matrix</span>
            </div>
            
            <div onclick="window.selectModel('Chaos Agent')" class="agent-card p-3 rounded-xl flex items-center gap-3 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                <span class="text-sm font-medium text-gray-200">Chaos Agent</span>
            </div>

            <div class="border-t border-white/10 mt-2 pt-2 px-1">
                <label class="flex items-center justify-between cursor-pointer p-2 hover:bg-white/5 rounded-lg transition-all">
                    <span class="text-xs font-medium text-gray-300">Reasoning</span>
                    <div class="relative inline-flex items-center">
                        <input type="checkbox" id="extended-thinking-toggle" class="sr-only peer">
                        <div class="w-9 h-5 bg-[#262626] rounded-full peer peer-focus:outline-none peer-checked:bg-white transition-colors border border-[#333]">
                            <div class="absolute top-[2px] left-[2px] w-[16px] h-[16px] rounded-full bg-[#a3a3a3] peer-checked:bg-black transition-transform peer-checked:translate-x-[16px] shadow-sm"></div>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <!-- 💬 MAIN CHAT AREA -->
        <main class="flex-1 flex flex-col h-full w-full relative z-10 pt-20 pb-[160px]">
            <div id="scroll-area" class="flex-1 overflow-y-auto w-full px-4 sm:px-6 relative flex flex-col items-center">
                <div class="w-full max-w-3xl flex flex-col relative min-h-full">
                    
                    <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center m-auto transition-opacity duration-500 pb-10 welcome-center">
                        <!-- Centered Logo exactly matching image_63293e -->
                        <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-black shadow-[0_0_30px_rgba(255,255,255,0.2)] mb-4">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                        </div>
                        <h1 id="greeting-text" class="text-3xl md:text-4xl text-center font-semibold text-white tracking-tight">Good evening.</h1>
                    </div>

                    <div id="message-container" class="w-full hidden flex-col justify-start z-10 space-y-6 pt-4 pb-4"></div>
                    <div id="thinking-indicator" class="hidden anim-pop mt-4 w-full shrink-0"></div>
                </div>
            </div>
        </main>

        <!-- 🔥 KINETIC SEARCH BAR (Glides smoothly from center to bottom on enter) -->
        <footer id="search-container" class="absolute z-40 flex flex-col items-center px-4 md:px-0 pointer-events-none input-mode-center">
            
            <div id="attachments-container" class="hidden w-full max-w-3xl flex flex-wrap items-end gap-3 pb-3 pointer-events-auto anim-slide-up px-2"></div>

            <div class="glass-island w-full rounded-[1.8rem] flex flex-col shadow-2xl pointer-events-auto relative overflow-hidden bg-[#0d0d0f]/95 border border-white/10">
                
                <div class="format-toolbar w-full justify-between items-center px-4 py-2 border-b border-white/5">
                    <div class="flex gap-4">
                        <button type="button" onclick="window.formatText('**', '**')" class="format-btn" title="Bold">B</button>
                        <button type="button" onclick="window.formatText('*', '*')" class="format-btn italic" title="Italic">I</button>
                        <button type="button" onclick="window.formatText('```\n', '\n```')" class="format-btn flex items-center gap-1" title="Code Block"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> CODE</button>
                    </div>
                    <div class="flex gap-3">
                        <span class="text-[9px] font-mono text-[var(--accent)] font-bold tracking-widest" id="token-counter">0 TOKENS</span>
                        <span class="text-[9px] font-mono text-gray-500 font-bold tracking-widest" id="typing-counter">0 WORDS</span>
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); if(isGenerating){ window.stopGeneration(); } else { window.handleSend(); } return false;" class="flex w-full items-end gap-2 relative z-20 p-2">
                    
                    <input type="file" id="system-file-upload" class="hidden" multiple onchange="window.handleAttachmentClick(this)" accept="*" />
                    
                    <div class="flex items-center shrink-0 mb-1 ml-1 gap-1">
                        <button type="button" onclick="document.getElementById('system-file-upload').click()" class="icon-btn w-9 h-9" title="Attach">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <button type="button" id="web-search-btn" onclick="window.toggleWebSearch()" class="icon-btn w-9 h-9" title="Live Web Access">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        </button>
                    </div>

                    <div class="flex-1 relative flex flex-col justify-center min-w-0 px-2">
                        <textarea id="chat-input" rows="1" oninput="window.updateWordCount(this.value); window.autoResize(this)" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); window.handleSend(); }" autocomplete="off" placeholder="Message Lura..."></textarea>
                    </div>
                    
                    <button type="submit" id="action-btn" class="icon-btn w-9 h-9 mb-1 mr-1 shrink-0 bg-transparent text-gray-400 hover:text-white" title="Send">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
            </div>
        </footer>
    </div>

    <!-- ⚙️ SETTINGS MODAL (Theme Engine Included) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md items-center justify-center hidden z-[99999] p-4">
        <div class="glass-panel w-full max-w-md p-6 rounded-2xl shadow-2xl flex flex-col anim-pop border border-white/10 bg-[#0d0d0d]">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-white/5">
                <h3 class="text-sm font-semibold text-white flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> System Configuration</h3>
                <button onclick="window.toggleSettingsModal()" class="w-6 h-6 rounded-full bg-white/5 flex items-center justify-center text-gray-400 hover:text-white transition-all outline-none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
            
            <div class="space-y-3">
                <div class="flex items-center justify-between p-3 rounded-lg bg-[#141414] border border-white/5">
                    <span class="text-xs font-semibold text-gray-300">Terminal Theme</span>
                    <select id="theme-selector" onchange="window.changeTheme(this.value)" class="bg-[#222] border border-white/10 text-white text-xs rounded px-2 py-1 outline-none">
                        <option value="default">Obsidian (Cyan)</option>
                        <option value="matrix">Matrix (Green)</option>
                        <option value="cyber">Cyberpunk (Pink)</option>
                    </select>
                </div>

                <label class="flex items-center justify-between p-3 rounded-lg bg-[#141414] border border-white/5 cursor-pointer">
                    <span class="text-xs font-semibold text-gray-300">Interface Audio (SFX)</span>
                    <div class="relative inline-flex items-center">
                        <input type="checkbox" id="toggle-sfx" class="sr-only peer" checked onchange="window.toggleSetting('sfx')">
                        <div class="w-11 h-6 bg-[#222] rounded-full peer peer-focus:outline-none peer-checked:bg-[var(--accent)] transition-colors border border-white/10">
                            <div class="absolute top-[2px] left-[2px] w-[20px] h-[20px] rounded-full bg-[#aaa] peer-checked:bg-black transition-transform peer-checked:translate-x-[20px] shadow-sm"></div>
                        </div>
                    </div>
                </label>

                <div class="mt-4 pt-3 border-t border-white/5">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">System Directive Override</label>
                    <textarea id="setting-prompt" rows="2" placeholder="Override Lura's base instructions..." class="w-full bg-[#0a0a0c] border border-white/5 rounded-lg p-2.5 text-xs text-white outline-none focus:border-[var(--accent)] transition-all resize-none" onblur="window.toggleSetting('prompt')"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const BACKEND_URL = "https://lura-backend-bkuu.onrender.com"; 

        let session = { active: false, name: "", token: null };
        let isGenerating = false;
        let sessionAttachments = []; 
        let currentModel = "Lura Core";
        let hasConversationStarted = false;
        let chatHistory = [];
        let currentSessionId = 'sess_' + Date.now();
        let currentAbortController = null;
        let webSearchActive = true;

        let sysSettings = JSON.parse(localStorage.getItem('lura_sys_settings')) || { sfx: true, web: true, prompt: "", theme: "default" };

        document.addEventListener('DOMContentLoaded', () => {
            if(sysSettings.theme) window.changeTheme(sysSettings.theme, false);
            initCanvas();
            if(document.getElementById('toggle-sfx')) document.getElementById('toggle-sfx').checked = sysSettings.sfx;
            if(document.getElementById('toggle-web')) document.getElementById('toggle-web').checked = sysSettings.web;
            if(document.getElementById('setting-prompt')) document.getElementById('setting-prompt').value = sysSettings.prompt || "";
            webSearchActive = sysSettings.web !== false;
            window.updateWebSearchUI();
        });

        function initCanvas() {
            const canvas = document.getElementById('space-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let particles = [];
            
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.2; this.vy = (Math.random() - 0.5) * 0.2;
                    this.radius = Math.random() * 1.2 + 0.3;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if(this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                    if(this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--node-color');
                    ctx.fill();
                }
            }
            
            for(let i=0; i<60; i++) particles.push(new Particle());
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const lineColor = getComputedStyle(document.body).getPropertyValue('--line-color').trim();
                
                for(let i=0; i<particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for(let j=i; j<particles.length; j++) {
                        let dx = particles[i].x - particles[j].x; let dy = particles[i].y - particles[j].y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < 120) {
                            ctx.beginPath(); 
                            const rgbMatch = lineColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                            if(rgbMatch) { ctx.strokeStyle = `rgba(${rgbMatch[1]}, ${rgbMatch[2]}, ${rgbMatch[3]}, ${0.12 - dist/900})`; }
                            else { ctx.strokeStyle = lineColor; }
                            ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        }

        window.changeTheme = function(themeName, playSound = true) {
            if(playSound) playSFX('click');
            document.body.className = '';
            if(themeName !== 'default') document.body.classList.add(`theme-${themeName}`);
            sysSettings.theme = themeName;
            localStorage.setItem('lura_sys_settings', JSON.stringify(sysSettings));
            const selector = document.getElementById('theme-selector');
            if(selector) selector.value = themeName;
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSFX(type) {
            try {
                if(!sysSettings.sfx) return;
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                if(type === 'login') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch(e) {}
        }

        window.handleLogin = function() {
            const userEl = document.getElementById('auth-user');
            if(!userEl) return;
            let user = userEl.value.trim();
            if(!user) user = "Shinchan";
            
            playSFX('login');
            session = { active: true, name: user };
            const lView = document.getElementById('login-view');
            if (lView) { lView.style.opacity = '0'; setTimeout(() => lView.classList.add('hidden'), 500); }
            
            const app = document.getElementById('app-workspace');
            if (app) { app.classList.remove('hidden'); app.classList.add('flex'); setTimeout(() => app.style.opacity = '1', 50); }
        };

        window.logOut = function() {
            if(confirm("Sign out?")) {
                playSFX('click');
                session.active = false;
                const appWorkspace = document.getElementById('app-workspace');
                if (appWorkspace) appWorkspace.style.opacity = '0';
                setTimeout(() => {
                    if (appWorkspace) { appWorkspace.classList.add('hidden'); appWorkspace.classList.remove('flex'); }
                    const loginView = document.getElementById('login-view');
                    if (loginView) { loginView.classList.remove('hidden'); loginView.style.opacity = '1'; }
                    document.getElementById('auth-user').value = '';
                    document.getElementById('auth-pass').value = '';
                    document.getElementById('message-container').innerHTML = '';
                    
                    const sc = document.getElementById('search-container');
                    const ws = document.getElementById('welcome-screen');
                    if(sc) { sc.classList.remove('input-mode-bottom'); sc.classList.add('input-mode-center'); }
                    if(ws) { ws.style.display = 'flex'; ws.style.opacity = '1'; }
                    
                    document.body.classList.remove('chat-active');
                    hasConversationStarted = false;
                }, 500);
            }
        };

        window.toggleWebSearch = function() {
            webSearchActive = !webSearchActive;
            sysSettings.web = webSearchActive;
            localStorage.setItem('lura_sys_settings', JSON.stringify(sysSettings));
            window.updateWebSearchUI();
            playSFX('click');
            window.showToast(webSearchActive ? "Web Access: ON" : "Web Access: OFF");
        };

        window.updateWebSearchUI = function() {
            const btn = document.getElementById('web-search-btn');
            if(btn) { if(webSearchActive) { btn.classList.add('active'); } else { btn.classList.remove('active'); } }
        };

        window.toggleFocusMode = function() {
            playSFX('click');
            document.body.classList.toggle('focus-mode');
            window.showToast(document.body.classList.contains('focus-mode') ? "Focus Mode: ON" : "Focus Mode: OFF");
        };

        window.nukeMemory = function() {
            if(!hasConversationStarted) return;
            playSFX('click');
            chatHistory = []; 
            const cont = document.getElementById('message-container');
            if (cont) {
                const div = document.createElement('div');
                div.className = "flex w-full justify-center shrink-0 mb-4 items-center anim-pop";
                div.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 text-red-400 font-mono text-[10px] uppercase tracking-widest px-4 py-1.5 rounded-full">Memory Purged</div>`;
                cont.appendChild(div);
            }
            window.showToast("Context Wiped");
        };

        window.updateWordCount = function(val) {
            const tc = document.getElementById('typing-counter');
            const tk = document.getElementById('token-counter');
            const words = val.trim() === '' ? 0 : val.trim().split(/\s+/).length; 
            const tokens = Math.ceil(words * 1.3);
            if(tc) tc.innerText = `${words} WORDS`;
            if(tk) tk.innerText = `${tokens} TOKENS`;
        }

        window.formatText = function(prefix, suffix) {
            playSFX('click');
            const textarea = document.getElementById('chat-input');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + prefix + text.substring(start, end) + suffix + text.substring(end);
            textarea.focus();
            window.autoResize(textarea);
        };

        window.autoResize = function(el) {
            if (!el) return;
            el.style.height = '24px';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
            const sendBtn = document.getElementById('action-btn');
            if (sendBtn && !isGenerating) {
                if(el.value.trim() !== "" || sessionAttachments.length > 0) {
                    sendBtn.style.color = "#fff";
                } else {
                    sendBtn.style.color = "var(--text-muted)";
                }
            }
        };

        window.enhancePrompt = function() {
            playSFX('click');
            const ci = document.getElementById('chat-input');
            if(!ci || !ci.value.trim()) { window.showToast("Type a prompt first."); return; } 
            ci.value = `Optimize this request for professional output: ${ci.value}`;
            window.autoResize(ci);
        };

        window.toggleModelDropdown = function(e) {
            e.stopPropagation();
            const md = document.getElementById('model-dropdown');
            if (md) md.classList.toggle('active');
        };
        
        window.selectModel = function(name) {
            playSFX('click');
            currentModel = name;
            const cml = document.getElementById('current-model-label');
            if (cml) cml.innerText = name;
            const md = document.getElementById('model-dropdown');
            if (md) md.classList.remove('active');
        };
        
        window.addEventListener('click', () => {
            const md = document.getElementById('model-dropdown');
            if (md) md.classList.remove('active');
        });

        window.toggleSettingsModal = function() {
            playSFX('click');
            const m = document.getElementById('settings-modal');
            if (m) {
                if(m.classList.contains('hidden')) { m.classList.remove('hidden'); m.classList.add('flex'); } 
                else { m.classList.add('hidden'); m.classList.remove('flex'); }
            }
        };

        window.showToast = function(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 glass-panel px-4 py-2 rounded-full text-xs font-semibold text-white shadow-2xl z-[999999] anim-slide-up border border-white/10 uppercase tracking-wider';
            toast.innerText = msg;
            document.body.appendChild(toast); 
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'all 0.4s ease'; setTimeout(() => toast.remove(), 400); }, 3000);
        };

        window.startNewChat = function() {
            playSFX('click');
            const mc = document.getElementById('message-container');
            if (mc) { mc.innerHTML = ''; mc.classList.add('hidden'); }
            
            const ws = document.getElementById('welcome-screen');
            const sc = document.getElementById('search-container');
            
            if(ws) ws.style.display = 'flex';
            if(sc) { sc.classList.remove('input-mode-bottom'); sc.classList.add('input-mode-center'); }
            
            document.body.classList.remove('chat-active');
            hasConversationStarted = false;
            currentSessionId = 'sess_' + Date.now();
            chatHistory = [];
            
            const ci = document.getElementById('chat-input');
            if (ci) { ci.value = ''; window.autoResize(ci); window.updateWordCount(''); }
        };

        window.handleAttachmentClick = function(input) { 
            if(input.files && input.files.length > 0) { Array.from(input.files).forEach(file => processFile(file)); }
            input.value = ''; 
        }
        
        function processFile(file) {
            if(!file) return;
            playSFX('click');
            const newAtt = { id: Date.now() + Math.random(), name: file.name, type: file.type.startsWith('image/') ? 'image' : 'text', data: null };
            if (newAtt.type === 'image') { 
                const reader = new FileReader();
                reader.onload = (e) => { newAtt.data = e.target.result; sessionAttachments.push(newAtt); window.renderAttachments(); }; 
                reader.readAsDataURL(file); 
            } else { 
                newAtt.data = "File attached."; sessionAttachments.push(newAtt); window.renderAttachments();
            }
        }
        
        window.renderAttachments = function() {
            const c = document.getElementById('attachments-container');
            const chatInput = document.getElementById('chat-input');
            if(!c) return;
            if(sessionAttachments.length === 0) { c.classList.add('hidden'); c.classList.remove('flex'); if (chatInput) window.autoResize(chatInput); return; }
            c.classList.remove('hidden'); c.classList.add('flex'); c.innerHTML = '';
            sessionAttachments.forEach((a, i) => {
                c.innerHTML += `
                <div class="glass-panel p-1.5 flex items-center gap-3 shadow-lg shrink-0 rounded-xl border border-white/5">
                    <span class="text-[11px] text-white font-medium truncate max-w-[120px]">${escapeHTML(a.name)}</span>
                    <button type="button" onclick="sessionAttachments.splice(${i},1); window.renderAttachments();" class="text-gray-500 hover:text-white">&times;</button>
                </div>`;
            });
            if (chatInput) window.autoResize(chatInput);
        };

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t])); }

        window.parseAndFormatBotText = function(rawText) {
            let thoughtHtml = ''; let mainText = rawText || "";
            if(!mainText) return { displayHtml: "", thoughtHtml: "" };

            let thoughtContent = "";
            const thoughtMatches = [...mainText.matchAll(/<thought>([\s\S]*?)<\/thought>/gi)];
            if (thoughtMatches.length > 0) {
                thoughtContent = thoughtMatches.map(m => m[1].trim()).join("\n\n");
                mainText = mainText.replace(/<thought>[\s\S]*?<\/thought>/gi, '').trim();
            }

            if (thoughtContent) {
                const tid = 'th-' + Math.random().toString(36).substr(2, 5);
                thoughtHtml = `
                <div class="mt-2 w-full flex flex-col items-start mb-3">
                    <button onclick="document.getElementById('${tid}').classList.toggle('hidden');" class="text-gray-500 hover:text-white text-[11px] font-mono tracking-wider outline-none bg-white/5 px-2.5 py-1 rounded border border-white/5">
                        [View Reasoning Process]
                    </button>
                    <div id="${tid}" class="hidden mt-2 p-3 bg-black/60 border border-white/5 rounded-lg font-mono text-[11px] text-gray-400 max-h-40 overflow-y-auto w-full leading-relaxed">${escapeHTML(thoughtContent)}</div>
                </div>`;
            }
            
            const parts = mainText.split(/```/g); let finalHtml = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) { 
                    finalHtml += escapeHTML(parts[i]).replace(/\n/g, '<br>');
                } else {
                    let codeContent = parts[i]; let firstNewline = codeContent.indexOf('\n'); let lang = firstNewline !== -1 ? codeContent.substring(0, firstNewline).trim() : ''; let actualCode = firstNewline !== -1 ? codeContent.substring(firstNewline + 1) : codeContent; const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
                    
                    finalHtml += `
                    <div class="code-box w-full bg-[#0a0a0c]">
                        <div class="flex items-center justify-between px-4 py-2 bg-[#141416] border-b border-white/5">
                            <span class="text-[10px] font-mono text-gray-400 uppercase">${escapeHTML(lang) || 'CODE'}</span>
                            <button onclick="navigator.clipboard.writeText(document.getElementById('${codeId}').innerText); window.showToast('Copied');" class="text-[10px] font-mono text-gray-400 hover:text-white">COPY</button>
                        </div>
                        <div class="p-4 overflow-x-auto text-[13px] text-gray-300 font-mono leading-relaxed">
                            <pre id="${codeId}"><code>${escapeHTML(actualCode)}</code></pre>
                        </div>
                    </div>`;
                }
            }
            return { displayHtml: finalHtml, thoughtHtml: thoughtHtml };
        };

        window.stopGeneration = function() {
            if(!isGenerating) return;
            isGenerating = false;
            if (currentAbortController) currentAbortController.abort();
        };

        // 🚀 KINETIC SEND ENGINE
        window.handleSend = async function() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('message-container');
            const scrollArea = document.getElementById('scroll-area');
            const welcomeScreen = document.getElementById('welcome-screen');
            const searchContainer = document.getElementById('search-container');
            const userText = input?.value.trim(); 
            
            if (userText === "" && sessionAttachments.length === 0) return;

            playSFX('send');
            isGenerating = true;

            if (!hasConversationStarted) {
                document.body.classList.add('chat-active');
                if (welcomeScreen) welcomeScreen.style.display = 'none';
                if (searchContainer) { searchContainer.classList.remove('input-mode-center'); searchContainer.classList.add('input-mode-bottom'); }
                hasConversationStarted = true;
            }

            if (container) {
                container.classList.remove('hidden'); container.classList.add('flex');
                const uDiv = document.createElement('div'); uDiv.className = "flex justify-end w-full shrink-0 mb-4 anim-pop";
                uDiv.innerHTML = `<div class="user-bubble max-w-[80%] text-[14px] text-white break-words whitespace-pre-wrap">${escapeHTML(userText)}</div>`;
                container.appendChild(uDiv);
                input.value = ''; window.autoResize(input);
            }
            
            sessionAttachments = []; window.renderAttachments();
            if (scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });

            const ind = document.getElementById('thinking-indicator');
            if (ind) {
                ind.innerHTML = `<div class="flex items-center gap-1.5 px-3 py-2"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
                ind.classList.remove('hidden'); ind.classList.add('flex');
            }

            let activeSystemPrompt = sysSettings.prompt && sysSettings.prompt.trim() !== "" ? sysSettings.prompt : "You are Lura, an elite AI built for Shinchan. Provide minimalist, highly structured, deeply technical answers.";

            const payload = {
                userMessage: userText, persona: currentModel, systemPrompt: activeSystemPrompt, 
                temperature: 0.7, webSearch: webSearchActive, messages: chatHistory
            };

            currentAbortController = new AbortController();

            try {
                let response = await fetch(`${BACKEND_URL}/api/chat`, { 
                    method: "POST", headers: { "Content-Type": "application/json" }, 
                    signal: currentAbortController.signal, body: JSON.stringify(payload) 
                });
                
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                const data = await response.json(); 
                if(data.error) throw new Error(data.error);

                if (!isGenerating) return; 

                const rawReply = data.reply;
                const parsed = window.parseAndFormatBotText(rawReply);
                
                if (ind) { ind.classList.add('hidden'); ind.classList.remove('flex'); ind.innerHTML = ''; }

                const aDiv = document.createElement('div'); aDiv.className = "flex w-full shrink-0 mb-8 items-start anim-pop";
                aDiv.innerHTML = `<div class="max-w-full flex-1 text-[15px] text-gray-200 leading-[1.7] bot-bubble">${parsed.displayHtml}${parsed.thoughtHtml}</div>`;
                container.appendChild(aDiv);
                
                chatHistory.push({ role: 'user', text: userText });
                chatHistory.push({ role: 'assistant', text: rawReply });

            } catch (error) {
                if (error.name === 'AbortError') return;
                if (ind) { ind.classList.add('hidden'); ind.classList.remove('flex'); ind.innerHTML = ''; }
                window.showToast("Network Error: Could not reach backend.");
            } finally { 
                isGenerating = false;
                if (scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
            }
        };
    </script>
</body>
</html>
